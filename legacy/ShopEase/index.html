<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopEase — Modern E-Commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0a0a; --surface:#111; --surface2:#1a1a1a; --border:#222;
      --accent:#ff6b35; --accent2:#ffd166; --text:#f0f0f0; --muted:#888;
      --success:#06d6a0; --radius:12px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
    nav{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.9);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);display:flex;align-items:center;
      justify-content:space-between;padding:0 2rem;height:64px;}
    .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;color:var(--accent);letter-spacing:-1px;}
    .nav-links{display:flex;gap:2rem;}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;cursor:pointer;transition:.2s;}
    .nav-links a:hover{color:var(--text);}
    .nav-right{display:flex;align-items:center;gap:1rem;}
    .search-wrap{position:relative;}
    .search-wrap input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
      padding:.45rem 1rem .45rem 2.2rem;color:var(--text);font-family:'DM Sans',sans-serif;
      width:200px;outline:none;font-size:.88rem;transition:.2s;}
    .search-wrap input:focus{border-color:var(--accent);width:240px;}
    .search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;}
    .cart-btn{position:relative;background:var(--accent);border:none;color:#fff;
      padding:.5rem 1.2rem;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;
      font-size:.9rem;font-weight:500;display:flex;align-items:center;gap:.5rem;transition:.2s;}
    .cart-btn:hover{opacity:.85;}
    .cart-badge{background:#fff;color:var(--accent);border-radius:50%;width:20px;height:20px;
      font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
    .hero{padding:5rem 2rem 3rem;text-align:center;
      background:radial-gradient(ellipse at 50% 0%,rgba(255,107,53,.12) 0%,transparent 70%);}
    .hero-tag{display:inline-block;background:rgba(255,107,53,.15);color:var(--accent);
      border:1px solid rgba(255,107,53,.3);border-radius:50px;padding:.3rem 1rem;
      font-size:.8rem;font-weight:600;margin-bottom:1.2rem;letter-spacing:.5px;}
    .hero h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:800;line-height:1.1;margin-bottom:.8rem;}
    .hero h1 span{color:var(--accent);}
    .hero p{color:var(--muted);max-width:480px;margin:0 auto 2rem;line-height:1.7;}
    .hero-stats{display:flex;justify-content:center;gap:3rem;}
    .stat{text-align:center;}
    .stat strong{display:block;font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--accent);}
    .stat span{color:var(--muted);font-size:.8rem;}
    .filters{padding:2rem;display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;}
    .filter-btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);
      padding:.45rem 1.1rem;border-radius:50px;cursor:pointer;font-family:'DM Sans',sans-serif;
      font-size:.85rem;transition:.2s;}
    .filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
    .sort-row{padding:0 2rem 1rem;display:flex;justify-content:space-between;align-items:center;}
    .results-count{color:var(--muted);font-size:.88rem;}
    .sort-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
      padding:.4rem .8rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:pointer;outline:none;}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;padding:0 2rem 4rem;}
    .product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      overflow:hidden;transition:.3s;cursor:pointer;position:relative;}
    .product-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 40px rgba(255,107,53,.12);}
    .product-img{width:100%;height:200px;display:flex;align-items:center;justify-content:center;
      font-size:4rem;background:var(--surface2);position:relative;}
    .product-badge{position:absolute;top:.7rem;left:.7rem;background:var(--accent);color:#fff;
      padding:.2rem .6rem;border-radius:50px;font-size:.72rem;font-weight:700;}
    .product-badge.sale{background:var(--success);}
    .wishlist-btn{position:absolute;top:.7rem;right:.7rem;background:rgba(0,0,0,.6);border:none;
      color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-size:1rem;transition:.2s;}
    .wishlist-btn.active{color:#ff4d6d;}
    .product-body{padding:1rem;}
    .product-cat{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.3rem;}
    .product-name{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;margin-bottom:.5rem;}
    .product-rating{color:var(--accent2);font-size:.8rem;margin-bottom:.6rem;}
    .product-rating span{color:var(--muted);}
    .product-price{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;}
    .price-main{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:var(--accent);}
    .price-old{color:var(--muted);font-size:.85rem;text-decoration:line-through;}
    .add-cart{width:100%;background:var(--accent);border:none;color:#fff;padding:.65rem;
      border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;
      font-size:.9rem;transition:.2s;}
    .add-cart:hover{opacity:.85;}
    .add-cart.added{background:var(--success);}
    .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;backdrop-filter:blur(4px);}
    .cart-overlay.open{display:block;}
    .cart-drawer{position:fixed;right:0;top:0;bottom:0;width:380px;max-width:100%;
      background:var(--surface);z-index:201;transform:translateX(100%);
      transition:.3s;display:flex;flex-direction:column;border-left:1px solid var(--border);}
    .cart-drawer.open{transform:translateX(0);}
    .cart-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .cart-header h2{font-family:'Syne',sans-serif;font-weight:800;}
    .close-btn{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;}
    .cart-items{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem;}
    .cart-item{background:var(--surface2);border-radius:8px;padding:.8rem;display:flex;gap:.8rem;align-items:center;}
    .cart-item-icon{font-size:1.8rem;width:48px;text-align:center;}
    .cart-item-info{flex:1;}
    .cart-item-name{font-weight:500;font-size:.9rem;margin-bottom:.2rem;}
    .cart-item-price{color:var(--accent);font-weight:700;font-size:.9rem;}
    .cart-qty{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;}
    .qty-btn{background:var(--border);border:none;color:var(--text);width:24px;height:24px;border-radius:4px;cursor:pointer;}
    .remove-item{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;}
    .remove-item:hover{color:#ff4d6d;}
    .cart-footer{padding:1.5rem;border-top:1px solid var(--border);}
    .cart-total{display:flex;justify-content:space-between;margin-bottom:1rem;}
    .cart-total strong{font-family:'Syne',sans-serif;font-size:1.2rem;}
    .checkout-btn{width:100%;background:var(--accent);border:none;color:#fff;padding:.8rem;
      border-radius:8px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;transition:.2s;}
    .checkout-btn:hover{opacity:.85;}
    .empty-cart{text-align:center;padding:3rem 1rem;color:var(--muted);}
    .empty-cart .icon{font-size:3rem;margin-bottom:1rem;}
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);
      background:var(--success);color:#fff;padding:.7rem 1.5rem;border-radius:50px;
      font-weight:500;font-size:.88rem;transition:.3s;z-index:300;opacity:0;pointer-events:none;}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    @media(max-width:600px){
      .hero-stats{gap:1.5rem;}
      .products-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;}
      .nav-links{display:none;}
      .search-wrap input{width:120px;}
    }
  </style>
</head>
<body>
<nav>
  <div class="logo">ShopEase</div>
  <div class="nav-links">
    <a onclick="filterBy('all',null)">Home</a>
    <a onclick="filterBy('electronics',null)">Electronics</a>
    <a onclick="filterBy('fashion',null)">Fashion</a>
    <a onclick="filterBy('home',null)">Home & Living</a>
  </div>
  <div class="nav-right">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="Search products..." oninput="handleSearch()"/>
    </div>
    <button class="cart-btn" onclick="openCart()">
      🛒 Cart <span class="cart-badge" id="cartCount">0</span>
    </button>
  </div>
</nav>

<div class="hero">
  <div class="hero-tag">✦ Free shipping on orders over $50</div>
  <h1>Shop <span>Smarter</span>,<br>Live Better.</h1>
  <p>Discover curated products across electronics, fashion, and home — all in one beautifully simple place.</p>
  <div class="hero-stats">
    <div class="stat"><strong>2K+</strong><span>Products</span></div>
    <div class="stat"><strong>50K+</strong><span>Customers</span></div>
    <div class="stat"><strong>4.8★</strong><span>Rating</span></div>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterBy('all',this)">All Products</button>
  <button class="filter-btn" onclick="filterBy('electronics',this)">⚡ Electronics</button>
  <button class="filter-btn" onclick="filterBy('fashion',this)">👗 Fashion</button>
  <button class="filter-btn" onclick="filterBy('home',this)">🏠 Home & Living</button>
  <button class="filter-btn" onclick="filterBy('sports',this)">🏃 Sports</button>
</div>

<div class="sort-row">
  <span class="results-count" id="resultsCount">Showing 12 products</span>
  <select class="sort-select" id="sortSelect" onchange="renderProducts()">
    <option value="default">Sort: Featured</option>
    <option value="price-asc">Price: Low → High</option>
    <option value="price-desc">Price: High → Low</option>
    <option value="rating">Highest Rated</option>
  </select>
</div>

<div class="products-grid" id="productsGrid"></div>

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2>Your Cart 🛒</h2>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-total"><span>Total</span><strong id="cartTotal">$0.00</strong></div>
    <button class="checkout-btn" onclick="showToast('Order placed successfully! 🎉')">Proceed to Checkout →</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const products=[
  {id:1,name:"Wireless ANC Headphones",cat:"electronics",price:89.99,old:129.99,rating:4.8,reviews:234,icon:"🎧",badge:"Sale",sale:true},
  {id:2,name:"Mechanical Keyboard RGB",cat:"electronics",price:74.99,old:null,rating:4.6,reviews:187,icon:"⌨️",badge:"New",sale:false},
  {id:3,name:"Slim Leather Wallet",cat:"fashion",price:24.99,old:39.99,rating:4.5,reviews:312,icon:"👛",badge:"Sale",sale:true},
  {id:4,name:"Running Shoes Pro",cat:"sports",price:59.99,old:89.99,rating:4.7,reviews:456,icon:"👟",badge:"Hot",sale:true},
  {id:5,name:"Ceramic Pour-Over Set",cat:"home",price:34.99,old:null,rating:4.9,reviews:89,icon:"☕",badge:"Top Pick",sale:false},
  {id:6,name:"Smart Fitness Watch",cat:"electronics",price:129.99,old:179.99,rating:4.4,reviews:203,icon:"⌚",badge:"Sale",sale:true},
  {id:7,name:"Linen Summer Blazer",cat:"fashion",price:69.99,old:null,rating:4.3,reviews:145,icon:"🧥",badge:"New",sale:false},
  {id:8,name:"Yoga Mat Premium",cat:"sports",price:42.99,old:54.99,rating:4.8,reviews:378,icon:"🧘",badge:"Sale",sale:true},
  {id:9,name:"Table Lamp Minimalist",cat:"home",price:55.00,old:null,rating:4.6,reviews:92,icon:"💡",badge:null,sale:false},
  {id:10,name:"Wireless Earbuds Pro",cat:"electronics",price:49.99,old:79.99,rating:4.5,reviews:521,icon:"🎵",badge:"Sale",sale:true},
  {id:11,name:"Denim Jacket Classic",cat:"fashion",price:79.99,old:null,rating:4.4,reviews:167,icon:"👖",badge:null,sale:false},
  {id:12,name:"Portable Blender",cat:"home",price:29.99,old:44.99,rating:4.7,reviews:234,icon:"🥤",badge:"Sale",sale:true},
];
let cart=JSON.parse(localStorage.getItem('se_cart')||'[]');
let wishlist=JSON.parse(localStorage.getItem('se_wish')||'[]');
let activeFilter='all';
let searchQ='';
function save(){localStorage.setItem('se_cart',JSON.stringify(cart));localStorage.setItem('se_wish',JSON.stringify(wishlist));}
function getProducts(){
  let p=[...products];
  if(activeFilter!=='all')p=p.filter(x=>x.cat===activeFilter);
  if(searchQ)p=p.filter(x=>x.name.toLowerCase().includes(searchQ.toLowerCase()));
  const s=document.getElementById('sortSelect').value;
  if(s==='price-asc')p.sort((a,b)=>a.price-b.price);
  else if(s==='price-desc')p.sort((a,b)=>b.price-a.price);
  else if(s==='rating')p.sort((a,b)=>b.rating-a.rating);
  return p;
}
function renderProducts(){
  const p=getProducts();
  document.getElementById('resultsCount').textContent=`Showing ${p.length} products`;
  const g=document.getElementById('productsGrid');
  if(!p.length){g.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem">No products found.</p>';return;}
  g.innerHTML=p.map(x=>{
    const inW=wishlist.includes(x.id);
    const inC=cart.find(c=>c.id===x.id);
    return`<div class="product-card">
      <div class="product-img">
        ${x.badge?`<div class="product-badge ${x.sale?'sale':''}">${x.badge}</div>`:''}
        <button class="wishlist-btn ${inW?'active':''}" onclick="toggleWish(${x.id},event)">${inW?'❤️':'🤍'}</button>
        <span style="font-size:3.5rem">${x.icon}</span>
      </div>
      <div class="product-body">
        <div class="product-cat">${x.cat}</div>
        <div class="product-name">${x.name}</div>
        <div class="product-rating">${'★'.repeat(Math.floor(x.rating))}${'☆'.repeat(5-Math.floor(x.rating))} <span>(${x.reviews})</span></div>
        <div class="product-price">
          <span class="price-main">$${x.price.toFixed(2)}</span>
          ${x.old?`<span class="price-old">$${x.old.toFixed(2)}</span>`:''}
        </div>
        <button class="add-cart ${inC?'added':''}" onclick="addCart(${x.id})">${inC?'✓ Added to Cart':'Add to Cart'}</button>
      </div>
    </div>`;
  }).join('');
}
function addCart(id){
  const p=products.find(x=>x.id===id);
  const ex=cart.find(c=>c.id===id);
  if(ex)ex.qty++;else cart.push({...p,qty:1});
  save();updateCount();renderProducts();renderCartItems();showToast(`${p.name} added to cart! 🛒`);
}
function toggleWish(id,e){
  e.stopPropagation();
  if(wishlist.includes(id)){wishlist=wishlist.filter(w=>w!==id);showToast('Removed from wishlist');}
  else{wishlist.push(id);showToast('Added to wishlist ❤️');}
  save();renderProducts();
}
function updateCount(){document.getElementById('cartCount').textContent=cart.reduce((a,c)=>a+c.qty,0);}
function renderCartItems(){
  const el=document.getElementById('cartItems');
  const footer=document.getElementById('cartFooter');
  if(!cart.length){el.innerHTML='<div class="empty-cart"><div class="icon">🛒</div><p>Your cart is empty</p></div>';footer.style.display='none';return;}
  footer.style.display='block';
  el.innerHTML=cart.map(c=>`<div class="cart-item">
    <div class="cart-item-icon">${c.icon}</div>
    <div class="cart-item-info">
      <div class="cart-item-name">${c.name}</div>
      <div class="cart-item-price">$${(c.price*c.qty).toFixed(2)}</div>
      <div class="cart-qty">
        <button class="qty-btn" onclick="changeQty(${c.id},-1)">−</button>
        <span>${c.qty}</span>
        <button class="qty-btn" onclick="changeQty(${c.id},1)">+</button>
      </div>
    </div>
    <button class="remove-item" onclick="removeCart(${c.id})">🗑</button>
  </div>`).join('');
  document.getElementById('cartTotal').textContent=`$${cart.reduce((a,c)=>a+c.price*c.qty,0).toFixed(2)}`;
}
function changeQty(id,d){const c=cart.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);save();updateCount();renderCartItems();renderProducts();}
function removeCart(id){cart=cart.filter(x=>x.id!==id);save();updateCount();renderCartItems();renderProducts();}
function openCart(){document.getElementById('cartDrawer').classList.add('open');document.getElementById('cartOverlay').classList.add('open');renderCartItems();}
function closeCart(){document.getElementById('cartDrawer').classList.remove('open');document.getElementById('cartOverlay').classList.remove('open');}
function filterBy(cat,btn){
  activeFilter=cat;
  if(btn){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  renderProducts();
}
function handleSearch(){searchQ=document.getElementById('searchInput').value;renderProducts();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
updateCount();renderProducts();
</script>
</body>
</html>
